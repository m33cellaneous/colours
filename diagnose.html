<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Connection check</title>
<style>
body{font-family:system-ui,sans-serif;max-width:520px;margin:24px auto;padding:0 16px;line-height:1.5}
li{margin:10px 0}.ok{color:#1a7f37}.bad{color:#b42318}
button{font:inherit;padding:10px 16px;border-radius:10px;border:0;background:#333;color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){body{background:#171513;color:#f2eee9}.ok{color:#56d364}.bad{color:#ff7b72}}
</style>
</head>
<body>
<h1>Connection check</h1>
<p>Open this page from your website's own address, press the button, and send me the lines it shows. It sends one test message to the suggestion inbox, so one email should arrive.</p>
<button id="go">Run the check</button>
<ol id="out"></ol>
<p id="verdict"></p>
<script>
const EP='https://api.web3forms.com/submit',KEY='9e18dc17-15bd-4f85-892f-82aa9ad98452';
const out=document.getElementById('out'),verdict=document.getElementById('verdict');
const line=(ok,t)=>{const li=document.createElement('li');li.className=ok?'ok':'bad';li.textContent=(ok?'OK: ':'FAILED: ')+t;out.appendChild(li);};
document.getElementById('go').onclick=async()=>{
  out.innerHTML='';verdict.textContent='';let general=false,reach=false,answered=false,okAnswer=false,detail='';
  line(location.protocol!=='file:','0. This page is open from: '+location.origin+location.pathname+(location.protocol==='file:'?' (a file on your computer: open it from the website address instead)':''));
  try{const r=await fetch('https://api.github.com/zen');general=r.ok;line(general,'1. Browser can make a cross-site request at all (GitHub test), answer '+r.status);}
  catch(e){line(false,'1. Browser cannot make cross-site requests here ('+e.message+')');}
  try{await fetch('https://api.web3forms.com/',{mode:'no-cors'});reach=true;line(true,'2. api.web3forms.com can be reached');}
  catch(e){line(false,'2. api.web3forms.com cannot be reached ('+e.message+')');}
  try{
    const r=await fetch(EP,{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({access_key:KEY,subject:'[emotion-app] connection test',from_name:'Emotion app',message:'Connection test sent from '+location.href})});
    let j={};try{j=await r.json();}catch(e){}
    answered=true;okAnswer=r.ok&&j.success!==false;detail=r.status+' '+JSON.stringify(j).slice(0,200);line(okAnswer,'3. Test message: the service answered '+detail);
  }catch(e){line(false,'3. Test message could not be sent ('+e.message+')');}
  verdict.textContent=!general?'Your browser or network is blocking cross-site requests (a blocker, privacy setting or network rule). Try another browser, or phone data.'
    :!reach?'api.web3forms.com is blocked on this browser or network (blocker or network rule). Try with blockers off, or another device.'
    :!answered?'The service is reachable but the browser could not complete the request. Try with blockers off; if it still fails, send me these lines.'
    :okAnswer?'The request got through. An email should arrive shortly at the registered inbox (check spam).'
    :'The service answered but refused the message. Read the answer in line 3: a message about the domain or origin means the allowed-website setting needs changing (use just the domain, m33cellaneous.github.io).';
};
</script>
</body>
</html>
